// Gradle for the incall_flutter Android plugin. The native Callio Android SDK comes from JitPack.
group 'com.ngx.incall.flutter'
version '0.2.2'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects { repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.ngx.incall.flutter'
    compileSdk 34
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.github.iamakkshay.callio-sdk:incall-sdk:0.2.2'   // the native Callio Android SDK
}
