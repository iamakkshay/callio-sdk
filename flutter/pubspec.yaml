name: incall_flutter
description: Callio in-app voice calling, chat and live location for Flutter, on the native Callio iOS and Android SDKs, with optional ready-made call and chat screens.
version: 0.3.2
homepage: https://github.com/iamakkshay/callio-sdk
repository: https://github.com/iamakkshay/callio-sdk/tree/main/flutter

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ngx.incall.flutter
        pluginClass: InCallFlutterPlugin
      ios:
        pluginClass: InCallFlutterPlugin
